name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-and-api:
    name: Web, API, and WASM checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Install dependencies
        run: npm ci

      - name: Test WASM crate
        run: cargo test --manifest-path wasm/Cargo.toml

      - name: Lint WASM crate
        run: cargo clippy --manifest-path wasm/Cargo.toml -- -D warnings

      - name: Build WASM package
        run: wasm-pack build --target web --release --out-dir ../app/src/wasm-pkg --out-name avi_wasm wasm

      - name: Run frontend unit tests
        run: npm test

      - name: Typecheck and build app
        run: npm run build --workspace=app

      - name: Typecheck API
        run: npx --prefix api tsc -p api/tsconfig.json --noEmit

  desktop-rust:
    name: Tauri desktop Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Install Linux WebKitGTK / Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Install dependencies and build frontendDist
        run: |
          npm ci
          wasm-pack build --target web --release --out-dir ../app/src/wasm-pkg --out-name avi_wasm wasm
          npm run build --workspace=app

      - name: Check Tauri crate
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Lint Tauri crate
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Test Tauri crate
        run: cargo test --manifest-path src-tauri/Cargo.toml
